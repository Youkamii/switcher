<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>switcher</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar" data-tauri-drag-region>
        <span id="drag-handle" data-tauri-drag-region title="잡고 이동">☰</span>
        <h1 data-tauri-drag-region>switcher</h1>
        <div class="tb-actions">
          <input id="alpha" type="range" min="0" max="100" step="5" title="투명도 (0 = 골조만)" />
          <button id="pin" title="사용량만 보이게 고정 (버튼 숨김)">고정</button>
          <button id="refresh" title="사용량 새로고침">새로고침</button>
          <button id="hide" title="트레이로 숨기기">✕</button>
        </div>
      </header>
      <main id="app"></main>
      <div id="toast" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
