<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>monitor</title>
    <style>
      /* 시스템 모니터 — 위젯 팔레트의 부속 창. 터미널풍 모노 수치 + 파스텔 바.
         행별 색: CPU 보라(액센트) / MEM 초록 / DSK 노랑 / NET 파랑 */
      :root {
        color-scheme: dark;
        --bg: rgba(22, 22, 30, 0.97);
        --line: rgba(52, 52, 74, 0.9);
        --text: #e6e6ef;
        --muted: #8b8b9e;
        --accent: #a78bfa;
        --ok: #4ade80;
        --warn: #facc15;
        --net: #60a5fa;
        --danger: #f87171;
        font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
        font-size: 12px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100vh;
        background: transparent;
      }
      body {
        color: var(--text);
        overflow: hidden;
        user-select: none;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
        padding-bottom: 8px;
      }
      .mtb {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px 6px;
        cursor: grab;
        flex: none;
        font-family: Consolas, "Cascadia Mono", monospace;
      }
      #mdrag {
        color: var(--muted);
        font-size: 12px;
      }
      /* 살아있다는 심장박동 점 — 샘플이 도착할 때마다 한 번 부푼다 */
      #beat {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        flex: none;
        transition: transform 0.18s ease-out;
      }
      #beat.pump {
        transform: scale(1.55);
      }
      #title {
        color: var(--muted);
        font-size: 11px;
        flex: 1;
      }
      /* CPU 기분 표정 — 한가하면 느긋, 바쁘면 진지, 뜨거우면 울상 */
      #mood {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: -1px;
      }
      #mclose {
        border: none;
        background: none;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        padding: 2px 4px;
      }
      #mclose:hover {
        color: var(--text);
      }
      .rows {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        padding: 0 12px;
        min-height: 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .label {
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 10px;
        color: var(--muted);
        width: 26px;
        flex: none;
      }
      .bar {
        flex: 1;
        height: 7px;
        border-radius: 4px;
        background: rgba(52, 52, 74, 0.55);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 4px;
        background: var(--row-color, var(--accent));
        transition: width 0.5s ease, background 0.3s;
      }
      /* 90% 넘으면 색과 무관하게 위험색 */
      .bar.hot > i {
        background: var(--danger);
      }
      .val {
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 10.5px;
        color: var(--text);
        text-align: right;
        flex: none;
        min-width: 78px;
        white-space: nowrap;
      }
      #row-cpu {
        --row-color: var(--accent);
      }
      #row-mem {
        --row-color: var(--ok);
      }
      #row-dsk {
        --row-color: var(--warn);
      }
      #row-net {
        --row-color: var(--net);
      }
      /* CPU 60초 스파크라인 — 기술적 디테일의 핵심 */
      #spark {
        display: block;
        width: 100%;
        height: 22px;
        margin: 2px 0 0;
      }
      #grip {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 16px;
        height: 16px;
        cursor: nwse-resize;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="mtb" data-tauri-drag-region>
        <span id="mdrag" data-tauri-drag-region>☰</span>
        <span id="beat"></span>
        <span id="title" data-tauri-drag-region>sys.mon</span>
        <span id="mood">(・ᴗ・)</span>
        <button id="mclose">✕</button>
      </header>
      <div class="rows">
        <div class="row" id="row-cpu">
          <span class="label">CPU</span>
          <span class="bar"><i></i></span>
          <span class="val">--%</span>
        </div>
        <canvas id="spark"></canvas>
        <div class="row" id="row-mem">
          <span class="label">MEM</span>
          <span class="bar"><i></i></span>
          <span class="val">--</span>
        </div>
        <div class="row" id="row-dsk">
          <span class="label">DSK</span>
          <span class="bar"><i></i></span>
          <span class="val">--</span>
        </div>
        <div class="row" id="row-net">
          <span class="label">NET</span>
          <span class="bar"><i></i></span>
          <span class="val">↓-- ↑--</span>
        </div>
      </div>
      <div id="grip"></div>
    </div>
    <script type="module" src="/src/monitor.ts"></script>
  </body>
</html>
