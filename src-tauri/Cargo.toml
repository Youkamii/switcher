[package]
name = "switcher"
version = "2.2.3"
description = "Multi-account switcher widget for Claude Code and Codex CLI"
authors = ["Youkamii"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: 맥에서 투명 창을 그리는 데 필요 (tauri.conf.json의 macOSPrivateApi와 짝)
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# 중복 실행 방지 — 두 인스턴스가 같은 프로필 토큰을 동시에 회전시키는 사고 차단
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false }
# Local Codex daemon control; no TCP listener and no external auth token host.
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
fs2 = "0.4"
# Parse Codex storage configuration before touching auth.json.
toml = "0.9"
toml_edit = "0.25"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
# 다른 PC로 옮기기 (#189): 비밀번호에서 열쇠를 만들고(Argon2id) 묶음을 잠근다(XChaCha20-Poly1305)
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
zeroize = "1"
# 옮기기 묶음을 잠그기 전에 줄인다 — 복사해 옮기는 글이 짧아진다 (이미 다른 크레이트가 쓰는 판)
miniz_oxide = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# sync: 토큰 재발급 직렬화(REFRESH_LOCK), time: TFSD 감시 루프의 주기 슬립,
# rt: 토큰 회전 응답 착지·티어 동기화를 호출자와 분리해 띄우는 Handle::spawn (#176·#177)
tokio = { version = "1", features = ["sync", "time", "rt"] }
# CLI 로그인 화면(TUI)을 읽으려면 진짜 콘솔이 필요하다 — 파이프로는 화면이 그려지지 않는다
portable-pty = "0.9"
# 시스템 모니터(stats.rs) — 쓰는 것만: system(cpu·mem·프로세스 디스크 I/O)·network.
# 기본 피처(component·user 등)는 의존성만 불린다 (reqwest와 같은 슬림 관례)
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "multithread"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"
# 부팅 시 자동 실행(HKCU Run 키)·바탕화면 실제 경로(User Shell Folders) 조회
winreg = "0.55"
# 새 .lnk 생성은 mslnk, 기존 링크 속성 보존 갱신은 Windows Shell Link COM을 쓴다
mslnk = "0.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# 로그인 취소 시 PTY 프로세스 그룹을 통째로 종료하는 데 사용
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# 위젯 창을 비활성 NSPanel로 바꿔 모든 Space·전체화면 위에 띄운다 (lib.rs 참고)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow", "NSResponder", "NSPanel"] }
# 부팅 시 자동 실행 — 로그인 항목 등록 (SMAppService, macOS 13+)
objc2-service-management = { version = "0.3", features = ["SMAppService"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
