[package]
name = "switcher"
version = "1.5.0"
description = "Multi-account switcher widget for Claude Code and Codex CLI"
authors = ["Youkamii"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: 맥에서 투명 창을 그리는 데 필요 (tauri.conf.json의 macOSPrivateApi와 짝)
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
# 중복 실행 방지 — 두 인스턴스가 같은 프로필 토큰을 동시에 회전시키는 사고 차단
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# 토큰 재발급의 동시 실행 직렬화(REFRESH_LOCK)에만 사용 — 런타임은 tauri가 제공
tokio = { version = "1", features = ["sync"] }
# CLI 로그인 화면(TUI)을 읽으려면 진짜 콘솔이 필요하다 — 파이프로는 화면이 그려지지 않는다
portable-pty = "0.9"

[target.'cfg(windows)'.dependencies]
# 부팅 시 자동 실행(HKCU Run 키)·바탕화면 실제 경로(User Shell Folders) 조회
winreg = "0.55"
# 바탕화면 바로가기(.lnk) 생성 — COM 없이 순수 Rust로 ShellLink 파일을 쓴다
mslnk = "0.1"

[target.'cfg(unix)'.dependencies]
# 로그인 취소 시 PTY 프로세스 그룹을 통째로 종료하는 데 사용
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# 격리 로그인이 만드는 키체인 항목 이름(설정 폴더 경로의 sha256 앞 8자) 계산
sha2 = "0.10"
# 위젯 창을 비활성 NSPanel로 바꿔 모든 Space·전체화면 위에 띄운다 (lib.rs 참고)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSWindow", "NSResponder", "NSPanel"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

