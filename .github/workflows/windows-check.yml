# Validation only: no release creation, asset upload, npm publish, or secrets.
name: windows-check

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - name: Frontend unit tests and build
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Production registration UI in Chromium on Windows
        shell: pwsh
        run: |
          $browsers = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          $env:CHROME_BIN = $browsers | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $env:CHROME_BIN) { throw 'Chromium browser not found' }
          node scripts/test-workspace-ui.mjs
      - name: Rust tests including native Windows credential flow
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - name: Install CLIs for isolated authentication checks
        run: npm install --global @anthropic-ai/claude-code@2.1.300 @openai/codex@0.167.0
      - name: Installed CLI authentication with synthetic credentials
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml windows_installed_clis_recognize_api_selection -- --ignored --test-threads=1
      - name: Running Codex session keeps its selected authentication
        run: node scripts/check-codex-session-auth.mjs
      - name: Windows portable application build
        run: npm run tauri build -- --no-bundle
      - name: Managed Codex reload preserves the selected account and conversation
        shell: pwsh
        run: ./scripts/check-codex-reload-windows.ps1
      - name: npm launcher recognizes the built Windows executable
        run: node scripts/check-packaged-dist.mjs
