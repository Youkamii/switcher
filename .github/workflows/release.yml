# 조용한 릴리스 채널 — v1.8.5 공개 릴리스를 한 번만 만들고 영구 다운로드
# 보관함으로 쓴다. 이후 버전은 같은 릴리스의 버전별 자산과 manifest만 갱신해
# GitHub 피드에 새 ReleaseEvent가 생기지 않게 한다. 릴리스 본문은 항상 비워 둔다.
#
# v1.8.5의 고정 이름 자산은 구형 앱이 새 채널로 넘어오기 위한 전환판이므로
# 이후 절대 덮어쓰지 않는다. npm과 새 앱은 버전별 이름 자산을 사용한다.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "빌드할 태그 (예: v1.7.33)"
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - run: npm run tauri build -- --no-bundle
      # zip 루트에 exe와 버전 표식 — 앱 업데이터가 태그와 실제 자산 버전을 대조한다.
      # dist.mjs는 extra 파일을 무시하고 switcher.exe만 설치한다.
      - name: pack
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $line = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $line) { throw 'Cargo.toml version not found' }
          $version = $line.Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "tag ($env:RELEASE_TAG) does not match Cargo version ($version)"
          }
          # 실제 바이너리·번들 버전의 출처는 tauri.conf.json이다 — 여기가 어긋난 채
          # 발행되면 업데이터의 자산 버전 대조가 그 릴리스를 영구 거부한다
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($conf -ne $version) {
            throw "tauri.conf.json version ($conf) does not match Cargo version ($version)"
          }
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($package -ne $version) {
            throw "package.json version ($package) does not match Cargo version ($version)"
          }
          $lock = node -p "require('./package-lock.json').packages[''].version"
          if ($lock -ne $version) {
            throw "package-lock.json version ($lock) does not match Cargo version ($version)"
          }
          [System.IO.File]::WriteAllText("$PWD/switcher-version.txt", $version, [System.Text.Encoding]::ASCII)
          Compress-Archive -Path src-tauri/target/release/switcher.exe,switcher-version.txt -DestinationPath switcher-win-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: switcher-win-x64
          path: switcher-win-x64.zip

  build-macos:
    runs-on: macos-15 # Apple Silicon — 자산 이름(mac-arm64)과 일치
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # 맥 .app의 CFBundleShortVersionString은 tauri.conf.json "version"에서 나온다 —
      # Cargo.toml만 올리고 이걸 빠뜨리면 CI는 초록불인데 업데이터의 번들 버전
      # 대조(update.rs)가 그 릴리스를 전 사용자에서 영구 거부한다. 빌드 전에 차단.
      - name: version guard
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          package=$(node -p "require('./package.json').version")
          lock=$(node -p "require('./package-lock.json').packages[''].version")
          if [ "$RELEASE_TAG" != "v$cargo" ]; then
            echo "tag ($RELEASE_TAG) does not match Cargo version ($cargo)" >&2
            exit 1
          fi
          if [ "$conf" != "$cargo" ]; then
            echo "tauri.conf.json version ($conf) does not match Cargo version ($cargo)" >&2
            exit 1
          fi
          if [ "$package" != "$cargo" ]; then
            echo "package.json version ($package) does not match Cargo version ($cargo)" >&2
            exit 1
          fi
          if [ "$lock" != "$cargo" ]; then
            echo "package-lock.json version ($lock) does not match Cargo version ($cargo)" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      # 애드혹 서명(tauri.conf.json signingIdentity "-") — 로컬 빌드와 동일
      - run: npm run tauri build -- --bundles app
      # zip 루트에 switcher.app — ditto가 서명·심링크를 보존한다 (dist.mjs -xk와 짝)
      - name: pack
        run: cd src-tauri/target/release/bundle/macos && ditto -c -k --keepParent switcher.app "$GITHUB_WORKSPACE/switcher-mac-arm64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: switcher-mac-arm64
          path: switcher-mac-arm64.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    concurrency:
      group: switcher-rolling-release
      cancel-in-progress: false
    permissions:
      actions: write # npm-publish.yml workflow_dispatch
      contents: write # 릴리스 생성·자산 업로드
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      ROLLING_RELEASE_TAG: v1.8.5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: update rolling release
        run: |
          WIN_VERSIONED="switcher-win-x64-$TAG.zip"
          MAC_VERSIONED="switcher-mac-arm64-$TAG.zip"
          WIN_LATEST="switcher-win-x64-latest.zip"
          MAC_LATEST="switcher-mac-arm64-latest.zip"

          cp switcher-win-x64.zip "$WIN_VERSIONED"
          cp switcher-mac-arm64.zip "$MAC_VERSIONED"
          cp switcher-win-x64.zip "$WIN_LATEST"
          cp switcher-mac-arm64.zip "$MAC_LATEST"

          if ! gh release view "$ROLLING_RELEASE_TAG" > /dev/null 2>&1; then
            if [ "$TAG" != "$ROLLING_RELEASE_TAG" ]; then
              echo "rolling release $ROLLING_RELEASE_TAG must be created by its bridge build" >&2
              exit 1
            fi
            gh release create "$ROLLING_RELEASE_TAG" --draft --verify-tag \
              --title "Switcher downloads" --notes ""
          fi

          RELEASE_JSON=$(gh release view "$ROLLING_RELEASE_TAG" --json isDraft,assets)
          IS_DRAFT=$(printf '%s' "$RELEASE_JSON" | jq -r .isDraft)
          HAS_MANIFEST=$(printf '%s' "$RELEASE_JSON" | jq -r \
            'any(.assets[]; .name == "switcher-update.json")')
          if [ "$TAG" != "$ROLLING_RELEASE_TAG" ] && [ "$IS_DRAFT" = "true" ]; then
            echo "rolling release $ROLLING_RELEASE_TAG is still a draft" >&2
            exit 1
          fi

          tag_key() {
            if ! [[ "$1" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "unsupported release tag: $1" >&2
              return 1
            fi
            local version="${1#v}"
            local major minor patch
            IFS=. read -r major minor patch <<< "$version"
            printf '%020d%020d%020d' "$major" "$minor" "$patch"
          }

          TAG_KEY=$(tag_key "$TAG") || exit 1
          if [ "$HAS_MANIFEST" = "true" ]; then
            gh release download "$ROLLING_RELEASE_TAG" \
              --pattern switcher-update.json --output previous-update.json || {
              echo "rolling release manifest download failed" >&2
              exit 1
            }
            CURRENT_TAG=$(jq -er .tag_name previous-update.json) || {
              echo "rolling release manifest has no valid tag_name" >&2
              exit 1
            }
            CURRENT_KEY=$(tag_key "$CURRENT_TAG") || exit 1
            if [[ "$TAG_KEY" < "$CURRENT_KEY" ]]; then
              echo "refusing to move rolling release backward: $CURRENT_TAG -> $TAG" >&2
              exit 1
            fi
          elif [ "$IS_DRAFT" != "true" ] || [ "$TAG" != "$ROLLING_RELEASE_TAG" ]; then
            echo "rolling release manifest is missing" >&2
            exit 1
          fi

          # 불변 버전 자산을 먼저 올린다. 같은 태그 재실행만 --clobber 대상이다.
          gh release upload "$ROLLING_RELEASE_TAG" "$WIN_VERSIONED" "$MAC_VERSIONED" --clobber

          # 사람용 최신 다운로드 링크는 별칭 두 개만 교체한다.
          gh release upload "$ROLLING_RELEASE_TAG" "$WIN_LATEST" "$MAC_LATEST" --clobber

          # v1.8.4 이하 앱이 마지막 공개 릴리스인 v1.8.5로 넘어올 때 쓰는 자산.
          if [ "$TAG" = "$ROLLING_RELEASE_TAG" ]; then
            gh release upload "$ROLLING_RELEASE_TAG" \
              switcher-win-x64.zip switcher-mac-arm64.zip --clobber
          fi

          WIN_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$ROLLING_RELEASE_TAG/$WIN_VERSIONED"
          MAC_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$ROLLING_RELEASE_TAG/$MAC_VERSIONED"
          jq -n \
            --arg tag "$TAG" \
            --arg win "$WIN_URL" \
            --arg mac "$MAC_URL" \
            '{tag_name: $tag, assets: [
              {name: "switcher-win-x64.zip", browser_download_url: $win},
              {name: "switcher-mac-arm64.zip", browser_download_url: $mac}
            ]}' > switcher-update.json

          # 최신정보 파일을 마지막에 바꿔야 앱이 아직 안 올라간 자산을 보지 않는다.
          gh release upload "$ROLLING_RELEASE_TAG" switcher-update.json --clobber

          if [ "$IS_DRAFT" = "true" ]; then
            gh release edit "$ROLLING_RELEASE_TAG" --draft=false
          fi
      # GITHUB_TOKEN으로 만든 release 이벤트는 다른 워크플로를 깨우지 않는다.
      - name: publish npm
        run: gh workflow run npm-publish.yml --ref "$TAG" -f tag="$TAG"
