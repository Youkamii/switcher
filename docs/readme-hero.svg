<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>switcher</title>
  <desc>One widget for switching Claude Code, Codex CLI, and GitHub CLI accounts.</desc>

  <defs>
    <linearGradient id="bg" x1="48" y1="18" x2="1160" y2="342" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1630" />
      <stop offset="0.55" stop-color="#0F0D18" />
      <stop offset="1" stop-color="#09080E" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C4B5FD" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(248 86) rotate(32) scale(420 260)">
      <stop stop-color="#8B5CF6" stop-opacity="0.30" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity="0.035" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#bg)" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#glow)" />
  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#grid)" />

  <g transform="translate(72 62)">
    <rect width="68" height="68" rx="19" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.38" />
    <path d="M14 17L27 52L34 26L42 52L55 17" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="72" y="185" fill="#F7F5FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="760" letter-spacing="-2.5">switcher</text>
  <text x="74" y="226" fill="#CFC9E4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="520">Claude. Codex. GitHub. One switcher.</text>
  <text x="74" y="262" fill="#8F89A3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Claude Code  ·  Codex CLI  ·  GitHub CLI</text>

